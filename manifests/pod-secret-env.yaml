# CKA practice: load all keys of a Secret as environment variables
apiVersion: v1
kind: Pod
metadata:
  name: webapp-pod-wl05
  namespace: canara-wl05
  labels:
    run: webapp-pod-wl05
spec:
  containers:
    - name: webapp-pod-wl05
      image: kodekloud/simple-webapp-mysql
      envFrom:
        - secretRef:
            name: db-secret-wl05
